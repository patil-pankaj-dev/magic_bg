<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 48" fill="none" width="100%" height="100%">
  <defs>
    <style>
      .logo-card-base { fill: #FFFFFF; stroke: #E2E8F0; }
      .logo-checker-a { fill: #F1F5F9; }
      .logo-checker-b { fill: #E2E8F0; }
      .logo-text { fill: #0F172A; }
      @media (prefers-color-scheme: dark) {
        .logo-card-base { fill: #131D2E; stroke: #1E293B; }
        .logo-checker-a { fill: #162032; }
        .logo-checker-b { fill: #1E2B42; }
        .logo-text { fill: #F8FAFC; }
      }
    </style>

    <linearGradient id="magicBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="magicCutoutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <pattern id="magicLogoCheckers" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" class="logo-checker-a"/>
      <rect x="4" width="4" height="4" class="logo-checker-b"/>
      <rect y="4" width="4" height="4" class="logo-checker-b"/>
      <rect x="4" y="4" width="4" height="4" class="logo-checker-a"/>
    </pattern>
  </defs>

  <!-- ICON CONTAINER (40x40 at x=4, y=4) -->
  <g transform="translate(4, 4)">
    <!-- Base Canvas / Checkerboard Background -->
    <rect x="0" y="0" width="40" height="40" rx="10" class="logo-card-base" stroke-width="1.5"/>
    <rect x="2" y="2" width="36" height="36" rx="8" fill="url(#magicLogoCheckers)"/>

    <!-- Cutout Subject Floating Layer -->
    <g>
      <rect x="12" y="8" width="26" height="30" rx="7" fill="url(#magicCutoutGrad)"/>
      <!-- Head -->
      <circle cx="25" cy="18" r="4" fill="#FFFFFF"/>
      <!-- Torso / Shoulders -->
      <path d="M17 32 C17 26.5, 20.5 24.5, 25 24.5 C29.5 24.5, 33 26.5, 33 32 Z" fill="#FFFFFF"/>
    </g>

    <!-- Magic Cut / Aperture Ring Arc -->
    <path d="M4 14 C4 7 8 4 15 4" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- AI Magic Sparkle Stars -->
    <path d="M37 1 L38.2 4.2 L42 5 L38.2 5.8 L37 9 L35.8 5.8 L32 5 L35.8 4.2 Z" fill="#38BDF8"/>
    <path d="M7 32 L7.8 33.8 L10 34.5 L7.8 35.2 L7 37 L6.2 35.2 L4 34.5 L6.2 33.8 Z" fill="#F59E0B"/>
  </g>

  <!-- WORDMARK: "Magic" + "back" -->
  <g transform="translate(56, 33)">
    <!-- "Magic" adapts to theme text color -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.03em" class="logo-text">Magic</text>

    <!-- "back" in a sleek modern pill badge -->
    <g transform="translate(74, -22)">
      <rect width="72" height="26" rx="13" fill="url(#magicBadgeGrad)"/>
      <text x="36" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.01em">back</text>
    </g>
  </g>
</svg>
