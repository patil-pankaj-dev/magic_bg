<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 48" fill="none" width="100%" height="100%">
  <defs>
    <style>
      .logo-card-base { fill: #FFFFFF; stroke: #E2E8F0; }
      .logo-checker-a { fill: #F1F5F9; }
      .logo-checker-b { fill: #E2E8F0; }
      .logo-text { fill: #0F172A; }
      @media (prefers-color-scheme: dark) {
        .logo-card-base { fill: #131D2E; stroke: #1E293B; }
        .logo-checker-a { fill: #162032; }
        .logo-checker-b { fill: #1E2B42; }
        .logo-text { fill: #F8FAFC; }
      }
    </style>

    <linearGradient id="rbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="rbCutoutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <pattern id="logoCheckers" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" class="logo-checker-a"/>
      <rect x="4" width="4" height="4" class="logo-checker-b"/>
      <rect y="4" width="4" height="4" class="logo-checker-b"/>
      <rect x="4" y="4" width="4" height="4" class="logo-checker-a"/>
    </pattern>
  </defs>

  <!-- ICON CONTAINER (40x40 at x=4, y=4) -->
  <g transform="translate(4, 4)">
    <!-- Base Canvas / Checkerboard Background -->
    <rect x="0" y="0" width="40" height="40" rx="10" class="logo-card-base" stroke-width="1.5"/>
    <rect x="2" y="2" width="36" height="36" rx="8" fill="url(#logoCheckers)"/>

    <!-- Cutout Subject Floating Layer -->
    <g>
      <rect x="12" y="8" width="26" height="30" rx="7" fill="url(#rbCutoutGrad)"/>
      <!-- Head -->
      <circle cx="25" cy="18" r="4" fill="#FFFFFF"/>
      <!-- Torso / Shoulders -->
      <path d="M17 32 C17 26.5, 20.5 24.5, 25 24.5 C29.5 24.5, 33 26.5, 33 32 Z" fill="#FFFFFF"/>
    </g>

    <!-- Magic Cut / Aperture Ring Arc -->
    <path d="M4 14 C4 7 8 4 15 4" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- AI Precision Sparkle Star -->
    <path d="M37 1 L38 4 L41 5 L38 6 L37 9 L36 6 L33 5 L36 4 Z" fill="#38BDF8"/>
  </g>

  <!-- WORDMARK: "Remove" + "-back" -->
  <g transform="translate(56, 33)">
    <!-- "Remove" adapts directly to theme text color -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.03em" class="logo-text">Remove</text>

    <!-- "-back" in a sleek modern pill badge -->
    <g transform="translate(90, -22)">
      <rect width="78" height="26" rx="13" fill="url(#rbGrad)"/>
      <text x="39" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.01em">-back</text>
    </g>
  </g>
</svg>
